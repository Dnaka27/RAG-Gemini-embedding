<article class="answer">
  <h3>Answer</h3>
  <div class="answer-top">
    <div class="answer-main">
      <p class="answer-text">{{ answer }}</p>
    </div>
    {% if plot_points %}
    <svg class="retrieval-plot" viewBox="0 0 {{ plot_size }} {{ plot_size }}" role="img" aria-label="Retrieved passages plotted by similarity distance; closer to the center means more relevant">
      <circle class="plot-query" cx="{{ plot_center }}" cy="{{ plot_center }}" r="5"></circle>
      {% for point in plot_points %}<line class="plot-link" x1="{{ plot_center }}" y1="{{ plot_center }}" x2="{{ point.x }}" y2="{{ point.y }}"></line>{% endfor %}
      {% for point in plot_points %}
      <circle class="plot-node" cx="{{ point.x }}" cy="{{ point.y }}" r="5"></circle>
      <text class="plot-label" x="{{ point.x }}" y="{{ point.label_y }}">{{ point.rank }}</text>
      {% endfor %}
      <line class="plot-sweep" x1="{{ plot_center }}" y1="{{ plot_center }}" x2="{{ plot_center }}" y2="{{ plot_sweep_y }}" style="transform-origin: {{ plot_center }}px {{ plot_center }}px"></line>
      <circle class="plot-sweep-tip" cx="{{ plot_center }}" cy="{{ plot_sweep_y }}" r="3" style="transform-origin: {{ plot_center }}px {{ plot_center }}px"></circle>
    </svg>
    {% endif %}
  </div>
  <div class="answer-sources">
    <details>
      <summary>Retrieved passages ({{ sources|length }})</summary>
      {% for source in sources %}
      <div class="source">
        <span class="source-rank">{{ forloop.counter }}</span>
        <div class="source-body">
          <small>Distance {{ source.distance|floatformat:4 }}</small>
          <p>{{ source.text }}</p>
        </div>
      </div>
      {% endfor %}
    </details>
  </div>
</article>
