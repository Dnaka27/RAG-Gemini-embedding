{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}RAG Console{% endblock %}</title>
  <meta name="description" content="Upload a document and ask questions about it. Passages are embedded with Gemini and retrieved by semantic similarity.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="RAG Console">
  <meta property="og:description" content="Upload a document and ask questions about it. Passages are embedded with Gemini and retrieved by semantic similarity.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#07080a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%237cf29c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    // Applied before first paint so the saved theme and the one-time boot reveal never flash.
    try {
      var theme = localStorage.getItem("rag-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (e) {}
    try {
      if (!sessionStorage.getItem("rag-booted")) document.documentElement.classList.add("boot");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/cloud.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</head>

<body>
  <div class="app{% if has_context %} has-doc{% endif %}" id="app">
    <header class="topbar" style="--i: 0">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">rag<span class="brand-sep">/</span>console</span>
      </span>
      {% include "web/partials/status_pill.html" with ready=has_context %}
      <span class="ttl" id="ttl" title="Time until the document expires" hidden>
        <span class="ttl-label">expires in</span>
        <span class="ttl-value" id="ttl-value">--:--:--</span>
      </span>
      <span class="topbar-spacer"></span>
      <button type="button" class="pill-button" id="about-open" aria-haspopup="dialog" aria-label="How it works">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="8" r="1.5"/><circle cx="12.5" cy="4" r="1.5"/><circle cx="12.5" cy="12" r="1.5"/><path d="M5 8h2.5c1.5 0 1.5-4 3.5-4M7.5 8c2 0 2 4 3.5 4"/></svg>
        <span>How it works</span>
      </button>
      <button type="button" class="icon-button" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
      </button>
      <a class="icon-button" aria-label="GitHub" href="https://github.com/Dnaka27" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </svg>
      </a>
      <a class="icon-button" aria-label="LinkedIn" href="https://www.linkedin.com/in/diogo-oike-kanefuku/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z" />
        </svg>
      </a>
    </header>

    <main class="workspace" id="workspace" style="--i: 1">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>

  {% block dialogs %}{% endblock %}
</body>

</html>
