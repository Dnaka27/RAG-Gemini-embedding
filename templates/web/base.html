{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RAG with Gemini{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Gemini-powered document search</p>
      <h1>Ask your document.</h1>
      <p class="lede">Upload a Markdown file, build its context, and get answers grounded in its content.</p>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
